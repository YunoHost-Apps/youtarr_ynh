#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "youtarr"
name = "Youtarr"
description.en = "Automatically download and organize YouTube channels and playlists for Plex, Jellyfin, Emby and Kodi"
description.fr = "Télécharge et organise automatiquement des chaînes et playlists YouTube pour Plex, Jellyfin, Emby et Kodi"

version = "1.90.2~ynh1"

maintainers = ["bowgartfield"]

[upstream]
license = "ISC"
admindoc = "https://github.com/DialmasterOrg/Youtarr/tree/main/docs"
userdoc = "https://github.com/DialmasterOrg/Youtarr#readme"
code = "https://github.com/DialmasterOrg/Youtarr"
fund = "https://www.patreon.com/c/ChrisDial"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "1G"
ram.build = "1024M"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    # No "path" question: Youtarr's client build references its static assets
    # with absolute root paths, so it only works installed at the root of a
    # (sub)domain. Omitting this question forces path="/" with no user choice.

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"
    help.en = "Youtarr has its own login system. This YunoHost user's name will be used to seed the initial admin account."
    help.fr = "Youtarr a son propre système de connexion. Le nom de cet utilisateur YunoHost sera utilisé pour créer le compte admin initial."

    [install.password]
    type = "password"
    help.en = "Initial password for the Youtarr admin account (8 to 64 characters)."
    help.fr = "Mot de passe initial du compte admin Youtarr (8 à 64 caractères)."

[resources]

    [resources.sources.main]
    url = "https://github.com/DialmasterOrg/Youtarr/archive/refs/tags/v1.90.2.tar.gz"
    sha256 = "7aa789f13d0c014abd8edbedd1e788a0e526e455bea1397def73c9b156469487"
    autoupdate.strategy = "latest_github_release"

    [resources.sources.yt-dlp]
    amd64.url = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux"
    amd64.sha256 = "767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795"
    arm64.url = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux_aarch64"
    arm64.sha256 = "e87e9533e89fe5889abaa21f5114dfe7756d6aa6219b83551add04d48b18e483"
    format = "whatever"
    extract = false
    rename = "yt-dlp"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/yt-dlp/yt-dlp"
    autoupdate.asset.amd64 = "yt-dlp_linux$"
    autoupdate.asset.arm64 = "yt-dlp_linux_aarch64$"

    [resources.sources.deno]
    # yt-dlp needs a JS runtime on PATH to solve YouTube's "n" challenge,
    # otherwise most video formats silently disappear (only images left).
    amd64.url = "https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip"
    amd64.sha256 = "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609"
    arm64.url = "https://github.com/denoland/deno/releases/download/v2.9.8/deno-aarch64-unknown-linux-gnu.zip"
    arm64.sha256 = "d49596c20b9788cf8f5d8ddf644103d4bde56ed239753f0bdb92ba9361d51905"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/denoland/deno"
    autoupdate.asset.amd64 = "deno-x86_64-unknown-linux-gnu.zip$"
    autoupdate.asset.arm64 = "deno-aarch64-unknown-linux-gnu.zip$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    #main.default = 3011

    [resources.apt]
    packages = "mariadb-server, ffmpeg, atomicparsley, python3, python3-venv"

    [resources.database]
    type = "mysql"

    [resources.nodejs]
    # Youtarr's package.json enforces engine-strict npm >=11.10.0 (bundled with
    # node 20/22's default npm is too old); node 24 ships a recent enough npm.
    version = "24"
